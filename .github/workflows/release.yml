# Packages POBT for Windows. A tag `vX.Y.Z` publishes it as a GitHub release; running it by hand only builds it
# (a workflow artifact). One archive, `pobt-windows-x86_64.zip`, carries no version, so
# `releases/latest/download/pobt-windows-x86_64.zip`, which the website and install.ps1 link, always resolves; the
# app's updater (`nsh.json` "updater") fetches `latest.json` beside it, which names that same archive.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The NSH CLI of the crates Cargo.toml takes from crates.io.
  NSH_VERSION: v0.6.1
  ASSET: pobt-windows-x86_64.zip

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/pobt-native
          key: release-windows

      - name: Install the NSH CLI
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA 'nsh\bin')

      - name: Test
        run: cargo test --lib --manifest-path ext/pobt-native/Cargo.toml

      - name: Package
        run: |
          args=(--build "$GITHUB_RUN_NUMBER")
          [ "$GITHUB_REF_TYPE" != tag ] || args+=(--app-version "${GITHUB_REF_NAME#v}")
          out="$RUNNER_TEMP/out"
          nsh package --target windows -o "$out" "${args[@]}"
          # The translations go beside POBT.exe, not into it, so anyone can edit them.
          cp -r trs "$out/POBT/trs"
          # Which translations these are, so the app fetches newer ones only (trs.yml).
          git rev-parse HEAD:trs > "$out/POBT/trs/.hash"
          (cd "$out" && for z in POBT.zip POBT-*.zip; do 7z a -tzip "$z" POBT/trs > /dev/null; done)
          ls -l "$out"
          mkdir -p dist
          # The installers' archive, and the versioned one for the updater.
          mv "$out/POBT.zip" "dist/$ASSET"
          for f in "$out"/POBT-*.zip; do
            mv "$f" "dist/$(basename "$f" | tr '[:upper:]' '[:lower:]')"
          done
          ls -l dist

      # The installer, run against this package served locally.
      - name: Try the installer
        run: |
          (cd dist && sha256sum "$ASSET" > sha256sums)
          (cd dist && exec python -m http.server 8765 > /dev/null 2>&1) &
          server=$!
          trap 'kill "$server" 2> /dev/null || true' EXIT
          sleep 2
          POBT_BASE_URL=http://127.0.0.1:8765 powershell -NoProfile -ExecutionPolicy Bypass -File website/public/install.ps1
          test -f "$LOCALAPPDATA/Programs/POBT/POBT.exe"
          test -f "$LOCALAPPDATA/Programs/POBT/trs/languages.json"
          rm dist/sha256sums

      # The app fetches `releases/latest/download/latest.json` and the archive it names (nsh/updater).
      - name: Write the update manifest
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' nsh.json > "$RUNNER_TEMP/nsh.json"
          mv "$RUNNER_TEMP/nsh.json" nsh.json
          nsh update-manifest dist/pobt-"$version"-*.zip --out dist
          # The manifest names the versioned archive `nsh package` made; it is the same file as $ASSET, so the release
          # carries that one only.
          jq --arg url "$ASSET" '.platforms[].url = $url' dist/latest.json > "$RUNNER_TEMP/latest.json"
          mv "$RUNNER_TEMP/latest.json" dist/latest.json
          rm dist/pobt-"$version"-*.zip
          cat dist/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: pobt-windows
          path: dist/
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > sha256sums
          cat sha256sums
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --verify-tag --generate-notes --title "POBT $GITHUB_REF_NAME"
          fi
