# Packages POBT for Windows, macOS and Linux. A tag `vX.Y.Z` publishes them as one GitHub release; running it by hand
# only builds them (workflow artifacts). Each platform's archive carries no version, so
# `releases/latest/download/<archive>`, which the website, README and install.ps1 link, always resolves:
#
# - `pobt-windows-x86_64.zip`
# - `pobt-macos-aarch64.tar.gz`
# - `pobt-linux-aarch64.tar.gz`
# - `pobt-linux-x86_64.tar.gz`
#
# The app's updater (`nsh.json` "updater") fetches `latest.json` beside them, which names those same archives.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The NSH CLI of the crates Cargo.toml takes from crates.io.
  NSH_VERSION: v0.6.1

defaults:
  run:
    shell: bash

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            asset: pobt-windows-x86_64.zip
          - os: macos-15
            platform: macos
            asset: pobt-macos-aarch64.tar.gz
          - os: ubuntu-24.04
            platform: linux
            asset: pobt-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            platform: linux
            asset: pobt-linux-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/pobt-native
          key: release-${{ matrix.asset }}

      - name: Install Linux system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install the NSH CLI
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA 'nsh\bin')
      - name: Install the NSH CLI
        if: matrix.platform != 'windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"

      - name: Test
        run: cargo test --lib --manifest-path ext/pobt-native/Cargo.toml

      # `nsh package` writes the app and `POBT-<version>-<os>-<arch>.<ext>`, the archive the updater takes. The
      # translations go into both, not into the program, so anyone can edit them: beside POBT.exe and the Linux
      # program, in the macOS bundle's Contents/Resources. Each versioned archive is then copied as $ASSET: the two
      # must be the same bytes, as the updater checks $ASSET against the hash the manifest takes of the versioned one.
      - name: Package
        run: |
          args=(--build "$GITHUB_RUN_NUMBER")
          [ "$GITHUB_REF_TYPE" != tag ] || args+=(--app-version "${GITHUB_REF_NAME#v}")
          out="$RUNNER_TEMP/out"
          case "${{ matrix.platform }}" in
            windows)
              nsh package --target windows -o "$out" "${args[@]}"
              cp -r trs "$out/POBT/trs"
              (cd "$out" && 7z a -tzip POBT-*.zip POBT/trs > /dev/null)
              ;;
            macos)
              nsh package --target macos --arch aarch64 -o "$out" "${args[@]}"
              cp -r trs "$out/POBT.app/Contents/Resources/trs"
              # Adding files breaks the bundle's ad hoc signature: sign it again.
              codesign --force --sign - --timestamp=none "$out/POBT.app"
              test "$(lipo -archs "$out/POBT.app/Contents/MacOS/POBT")" = arm64
              for f in "$out"/POBT-*.tar.gz; do
                COPYFILE_DISABLE=1 tar -czf "$f" -C "$out" POBT.app
              done
              ;;
            linux)
              nsh package --target linux -o "$out" "${args[@]}"
              cp -r trs "$out/POBT/trs"
              for f in "$out"/POBT-*.tar.gz; do
                tar -czf "$f" -C "$out" POBT
              done
              ;;
          esac
          ls -l "$out"
          mkdir -p dist
          for f in "$out"/POBT-*.zip "$out"/POBT-*.tar.gz; do
            [ -e "$f" ] || continue
            mv "$f" "dist/$(basename "$f" | tr '[:upper:]' '[:lower:]')"
          done
          archives=(dist/pobt-*)
          test "${#archives[@]}" -eq 1
          test "${archives[0]##*-}" = "${ASSET##*-}"
          cp "${archives[0]}" "dist/$ASSET"
          ls -l dist

      # The installer, run against this package served locally.
      - name: Try the installer
        if: matrix.platform == 'windows'
        run: |
          (cd dist && sha256sum "$ASSET" > sha256sums)
          (cd dist && exec python -m http.server 8765 > /dev/null 2>&1) &
          server=$!
          trap 'kill "$server" 2> /dev/null || true' EXIT
          sleep 2
          POBT_BASE_URL=http://127.0.0.1:8765 powershell -NoProfile -ExecutionPolicy Bypass -File website/public/install.ps1
          test -f "$LOCALAPPDATA/Programs/POBT/POBT.exe"
          test -f "$LOCALAPPDATA/Programs/POBT/trs/languages.json"
          rm dist/sha256sums

      - name: Check the archive
        if: matrix.platform != 'windows'
        run: |
          tar -tzf "dist/$ASSET" > "$RUNNER_TEMP/listing"
          grep -q '/trs/languages.json$' "$RUNNER_TEMP/listing"
          grep -qx "${{ matrix.platform == 'macos' && 'POBT.app/Contents/MacOS/POBT' || 'POBT/POBT' }}" "$RUNNER_TEMP/listing"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  # The app fetches `releases/latest/download/latest.json` and the archive it names for its platform (nsh/updater).
  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install the NSH CLI
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"

      - name: Write the update manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' nsh.json > "$RUNNER_TEMP/nsh.json"
          mv "$RUNNER_TEMP/nsh.json" nsh.json
          nsh update-manifest dist/pobt-"$version"-* --out dist
          # The manifest names the versioned archives `nsh package` made; each is the same file as its platform's
          # unversioned archive, so the release carries those only.
          jq -e 'if (.platforms | keys) == ["linux-aarch64","linux-x86_64","macos-aarch64","windows-x86_64"]
            then .platforms |= with_entries(.value.url = ("pobt-" + .key +
              (if .key == "windows-x86_64" then ".zip" else ".tar.gz" end)))
            else error("unexpected platform set") end' dist/latest.json > "$RUNNER_TEMP/latest.json"
          mv "$RUNNER_TEMP/latest.json" dist/latest.json
          rm dist/pobt-"$version"-*
          # The manifest must describe the archives the release carries.
          jq -r '.platforms[] | "\(.sha256)  dist/\(.url)"' dist/latest.json | sha256sum -c
          cat dist/latest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > sha256sums
          cat sha256sums
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --verify-tag --generate-notes --title "POBT $GITHUB_REF_NAME"
          fi
