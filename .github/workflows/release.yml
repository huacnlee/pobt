# Packages POBT for Windows. A tag `vX.Y.Z` publishes it as a GitHub release; running it by hand only builds it
# (a workflow artifact). `pobt-windows-x86_64.zip` carries no version, so
# `releases/latest/download/pobt-windows-x86_64.zip`, which the website and install.ps1 link, always resolves. The
# versioned archive and `latest.json` beside it are what the app's updater (`nsh.json` "updater") fetches.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The NSH CLI of the crates Cargo.toml takes from crates.io.
  NSH_VERSION: v0.6.1
  ASSET: pobt-windows-x86_64.zip

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Install the NSH CLI
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA 'nsh\bin')

      - name: Test
        run: cargo test --lib

      - name: Package
        run: |
          args=(--build "$GITHUB_RUN_NUMBER")
          [ "$GITHUB_REF_TYPE" != tag ] || args+=(--app-version "${GITHUB_REF_NAME#v}")
          out="$RUNNER_TEMP/out"
          nsh package --target windows -o "$out" "${args[@]}"
          ls -l "$out"
          mkdir -p assets
          # The installers' archive, and the versioned one for the updater.
          mv "$out/POBT.zip" "assets/$ASSET"
          for f in "$out"/POBT-*.zip; do
            mv "$f" "assets/$(basename "$f" | tr '[:upper:]' '[:lower:]')"
          done
          ls -l assets

      # The installer, run against this package served locally.
      - name: Try the installer
        run: |
          (cd assets && sha256sum "$ASSET" > sha256sums)
          (cd assets && exec python -m http.server 8765 > /dev/null 2>&1) &
          server=$!
          trap 'kill "$server" 2> /dev/null || true' EXIT
          sleep 2
          POBT_BASE_URL=http://127.0.0.1:8765 powershell -NoProfile -ExecutionPolicy Bypass -File website/public/install.ps1
          test -f "$LOCALAPPDATA/Programs/POBT/POBT.exe"
          rm assets/sha256sums

      # The app fetches `releases/latest/download/latest.json` and the versioned archive it names (nsh/updater).
      - name: Write the update manifest
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' nsh.json > "$RUNNER_TEMP/nsh.json"
          mv "$RUNNER_TEMP/nsh.json" nsh.json
          nsh update-manifest assets/pobt-"$version"-*.zip --out assets

      - uses: actions/upload-artifact@v4
        with:
          name: pobt-windows
          path: assets/
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          sha256sum * > sha256sums
          cat sha256sums
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --verify-tag --generate-notes --title "POBT $GITHUB_REF_NAME"
          fi
