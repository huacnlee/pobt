# Publishes the translations for installed POBTs to fetch (ext/pobt-native/src/trs.rs): trs.zip and trs.json, whose
# hash is the git tree of trs/, on the `trs` release. A prerelease, so releases/latest stays POBT's own.
name: Translations
on:
  push:
    branches: [main]
    paths: ["trs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack
        run: |
          hash=$(git rev-parse HEAD:trs)
          mkdir -p out
          (cd trs && zip -qr ../out/trs.zip . -x '.hash')
          printf '{"hash":"%s","commit":"%s"}\n' "$hash" "$GITHUB_SHA" > out/trs.json
          cat out/trs.json
          ls -l out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view trs > /dev/null 2>&1; then
            gh release create trs --prerelease --title "Translations" \
              --notes "The latest translations (trs/), which POBT fetches on its own. Updated on every change to trs/."
          fi
          gh release upload trs out/trs.zip out/trs.json --clobber
