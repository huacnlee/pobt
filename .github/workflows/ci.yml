# Checks pull requests and main: the Rust crate and the TSX type check (`nsh check`), and the Rust tests, side by
# side: each builds the crate its own way (`cargo check` and nsh's describe program; the test profile).
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: faster to build and link, smaller caches; a failing test still says where.
  CARGO_PROFILE_DEV_DEBUG: 0
  # The NSH CLI of the crates Cargo.toml takes from crates.io.
  NSH_VERSION: v0.6.1

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/pobt-native
          key: ci-check
      # The workspace nsh generates in `.nsh/rust` to build the program that describes the crate to the type check:
      # not rust-cache's, which cannot read a workspace that does not exist yet, and so keeps none of its build.
      - uses: actions/cache@v4
        with:
          path: |
            .nsh/rust/target
            .nsh/rust/Cargo.lock
          key: nsh-rust-${{ env.NSH_VERSION }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('ext/pobt-native/Cargo.lock') }}
          restore-keys: nsh-rust-${{ env.NSH_VERSION }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Install the NSH CLI
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA 'nsh\bin')

      - name: Check
        run: nsh check -v

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/pobt-native
          key: ci-test-deps-o0

      # The tests that run POB's Lua (its LuaJIT, its edit boxes) need a Path of Building: its latest portable
      # release, as POBT installs it, without the art and data they do not read, kept until a new one comes out.
      - name: Find Path of Building's release
        id: pob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/PathOfBuildingCommunity/PathOfBuilding/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "POB_DIR=$RUNNER_TEMP/pob" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        id: pob-cache
        with:
          path: ${{ runner.temp }}/pob
          key: pob-files-${{ steps.pob.outputs.tag }}-${{ hashFiles('scripts/fetch-pob.mjs') }}

      - name: Fetch Path of Building
        if: steps.pob-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-pob.mjs "${{ steps.pob.outputs.tag }}" "$POB_DIR"

      - name: Test
        run: |
          # Without a Path of Building the tests of POB's Lua would pass skipped.
          test -f "$POB_DIR/lua51.dll" && test -f "$POB_DIR/Classes/EditControl.lua"
          # The dependencies unoptimized (Cargo.toml's -O2 is for running the app): they build in a fraction of the
          # time, and the tests take a second either way.
          cargo test --lib --manifest-path ext/pobt-native/Cargo.toml --config 'profile.dev.package."*".opt-level=0'
