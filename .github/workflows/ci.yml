# Checks pull requests and main: the Rust crate and the TSX type check (`nsh check`), then the Rust tests.
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The NSH CLI of the crates Cargo.toml takes from crates.io.
  NSH_VERSION: v0.6.1

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/pobt-native
          key: ci-windows

      - name: Install the NSH CLI
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA 'nsh\bin')

      - name: Check
        run: nsh check

      # The tests that run POB's Lua (its LuaJIT, its edit boxes) need a Path of Building: its latest portable
      # release, as POBT installs it, kept until a new one comes out.
      - name: Find Path of Building's release
        id: pob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/PathOfBuildingCommunity/PathOfBuilding/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "POB_DIR=$RUNNER_TEMP/pob" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        id: pob-cache
        with:
          path: ${{ runner.temp }}/pob
          key: pob-${{ steps.pob.outputs.tag }}

      - name: Download Path of Building
        if: steps.pob-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pob.zip" https://github.com/PathOfBuildingCommunity/PathOfBuilding/releases/download/${{ steps.pob.outputs.tag }}/PathOfBuildingCommunity-Portable.zip
          mkdir -p "$POB_DIR"
          unzip -q "$RUNNER_TEMP/pob.zip" -d "$POB_DIR"
          # The passive trees' art (most of it) is not for the tests.
          rm -rf "$POB_DIR/TreeData"
          test -f "$POB_DIR/lua51.dll" && test -f "$POB_DIR/Classes/EditControl.lua"

      - name: Test
        run: cargo test --lib --manifest-path ext/pobt-native/Cargo.toml
