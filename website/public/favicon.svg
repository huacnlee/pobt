<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="stone" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f1c1a"/>
      <stop offset=".6" stop-color="#0f0d0c"/>
      <stop offset="1" stop-color="#050404"/>
    </radialGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e6e1"/>
      <stop offset=".45" stop-color="#9d9892"/>
      <stop offset=".55" stop-color="#5d5954"/>
      <stop offset="1" stop-color="#b9b4ad"/>
    </linearGradient>
    <linearGradient id="ironDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4541"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <radialGradient id="gem" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffb3a6"/>
      <stop offset=".25" stop-color="#d23a2c"/>
      <stop offset=".65" stop-color="#7a120b"/>
      <stop offset="1" stop-color="#2a0503"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c0281c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#c0281c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The plate -->
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#stone)"/>
  <rect x="52" y="52" width="920" height="920" rx="182" fill="none" stroke="url(#ironDark)" stroke-width="10"/>
  <rect x="70" y="70" width="884" height="884" rx="166" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="6"/>

  <!-- A glow behind the jewel -->
  <circle cx="512" cy="512" r="400" fill="url(#glow)"/>

  <!-- The keystone frame: ring with four points -->
  <g fill="url(#iron)" stroke="#141210" stroke-width="6">
    <path d="M512 118 L560 214 L464 214 Z"/>
    <path d="M512 906 L464 810 L560 810 Z"/>
    <path d="M118 512 L214 464 L214 560 Z"/>
    <path d="M906 512 L810 560 L810 464 Z"/>
  </g>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#000" stroke-width="66" stroke-opacity=".55"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#iron)" stroke-width="44"/>
  <circle cx="512" cy="512" r="322" fill="none" stroke="#141210" stroke-width="5"/>
  <circle cx="512" cy="512" r="278" fill="none" stroke="#141210" stroke-width="5"/>
  <!-- Studs on the ring -->
  <g fill="#d9d5cf" stroke="#1c1917" stroke-width="4">
    <circle cx="300" cy="300" r="14"/>
    <circle cx="724" cy="300" r="14"/>
    <circle cx="300" cy="724" r="14"/>
    <circle cx="724" cy="724" r="14"/>
  </g>

  <!-- The jewel -->
  <circle cx="512" cy="512" r="250" fill="url(#gem)"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="#180503" stroke-width="10"/>
  <path d="M340 400 A200 200 0 0 1 560 300" fill="none" stroke="#ffd6cf" stroke-opacity=".55" stroke-width="22" stroke-linecap="round"/>

  <!-- POB, forged in iron -->
  <text x="512" y="586" text-anchor="middle" font-family="Palatino Linotype, Book Antiqua, Georgia, serif" font-weight="700" font-size="200" letter-spacing="-4" fill="url(#iron)" stroke="#140806" stroke-width="10" paint-order="stroke">POB</text>
</svg>
