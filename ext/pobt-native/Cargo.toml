[package]
name = "pobt-native"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
keywords = ["nshm"]
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.1"
log = "0.4"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
flate2 = "1"
arboard = "3"
csv = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
texture2ddecoder = "0.1"
ureq = "2"
base64 = "0.22"
getrandom = "0.2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"

# POB ships its LuaJIT for Windows only (`lua51.dll`): elsewhere POBT builds its own in.
[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[target.'cfg(not(windows))'.dependencies]
mlua-sys = { version = "0.14", features = ["luajit", "vendored"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.pobt-native]
opt-level = 1
