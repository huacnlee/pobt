[package]
name = "pobt"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.1"
log = "0.4"
libloading = "0.8"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
flate2 = "1"
arboard = "3"
csv = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
texture2ddecoder = "0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.pobt]
opt-level = 1
